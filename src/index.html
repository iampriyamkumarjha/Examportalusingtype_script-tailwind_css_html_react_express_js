<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java Test Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f5f8;
    --panel: #ffffff;
    --ink: #1b2430;
    --muted: #5d6b7c;
    --line: #d9e0e8;
    --accent: #2447c9;
    --accent-soft: #e6ebfb;
    --good: #1c7c4b;
    --good-soft: #e2f4ea;
    --bad: #b3261e;
    --bad-soft: #fbe6e4;
    --code-bg: #1e2a3a;
    --code-ink: #e8eef6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a22; --panel: #1c242f; --ink: #e8eef6; --muted: #98a6b8; --line: #2e3947;
      --accent: #7f9cff; --accent-soft: #263154; --good: #5fd39a; --good-soft: #17352a;
      --bad: #ff8a80; --bad-soft: #3d1f1d; --code-bg: #0f151d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 "IBM Plex Sans", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 80px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  label { display: block; font-weight: 500; font-size: .9rem; margin-bottom: 6px; }
  input[type=text], select { width: 100%; padding: 10px 12px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  button { font: inherit; font-weight: 500; cursor: pointer; border: 0; border-radius: 6px; padding: 11px 20px; background: var(--accent); color: #fff; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button:disabled { opacity: .6; cursor: wait; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { background: var(--accent-soft); color: var(--accent); padding: 4px 10px; border-radius: 99px; font-size: .85rem; cursor: pointer; border: 0; }
  .actions { margin-top: 18px; display: flex; gap: 10px; align-items: center; }
  .error { color: var(--bad); margin-top: 12px; }
  .hidden { display: none; }

  .bar { position: sticky; top: 0; background: var(--bg); padding: 12px 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .bar .count { font-family: "IBM Plex Mono", monospace; font-size: .9rem; color: var(--muted); }
  .q { margin-bottom: 16px; }
  .q h3 { font-size: 1rem; margin: 0 0 10px; font-weight: 600; }
  .q .num { font-family: "IBM Plex Mono", monospace; color: var(--accent); margin-right: 6px; }
  pre { background: var(--code-bg); color: var(--code-ink); padding: 12px 14px; border-radius: 6px; overflow-x: auto; font: 400 .88rem/1.5 "IBM Plex Mono", monospace; margin: 0 0 12px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 7px; cursor: pointer; }
  .opt input { margin-top: 5px; }
  .opt.correct { background: var(--good-soft); border-color: var(--good); }
  .opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
  .explain { margin-top: 10px; font-size: .92rem; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 10px; }
  .score { text-align: center; }
  .score .big { font-size: 2.6rem; font-weight: 600; font-family: "IBM Plex Mono", monospace; }
</style>
</head>
<body>
<main>
  <h1>Java test generator</h1>
  <p class="sub">Pick any Java topic and get a multiple-choice test with answers and explanations.</p>

  <section id="setup" class="panel">
    <label for="topic">Topic</label>
    <input id="topic" type="text" placeholder="e.g. Collections, Multithreading, OOP, Exception handling" maxlength="100">
    <div class="chips" id="chips"></div>
    <div class="row">
      <div>
        <label for="count">Number of questions</label>
        <select id="count"><option>15</option><option>20</option><option>30</option></select>
      </div>
      <div>
        <label for="difficulty">Difficulty</label>
        <select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select>
      </div>
    </div>
    <div class="actions">
      <button id="generate">Generate test</button>
      <span id="status" class="sub" style="margin:0"></span>
    </div>
    <div id="error" class="error" role="alert"></div>
  </section>

  <section id="test" class="hidden">
    <div class="bar">
      <strong id="testTitle"></strong>
      <span class="count" id="progress"></span>
    </div>
    <div id="questions"></div>
    <div class="actions">
      <button id="submit">Submit test</button>
      <button id="newTest" class="ghost">New test</button>
    </div>
    <div id="result" class="panel score hidden" style="margin-top:20px"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let quiz = null;
let submitted = false;

["Collections", "OOP", "Multithreading", "Exception handling", "Streams & lambdas", "Strings", "JDBC", "Generics"]
  .forEach((t) => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = t;
    b.onclick = () => { $("topic").value = t; };
    $("chips").appendChild(b);
  });

$("generate").onclick = async () => {
  const topic = $("topic").value.trim();
  $("error").textContent = "";
  if (!topic) { $("error").textContent = "Enter a topic first."; return; }

  $("generate").disabled = true;
  $("status").textContent = "Generating questions… this can take up to a minute.";
  try {
    const res = await fetch("/api/generate-test", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic, count: Number($("count").value), difficulty: $("difficulty").value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed");
    quiz = data;
    renderTest(topic);
  } catch (e) {
    $("error").textContent = e.message;
  } finally {
    $("generate").disabled = false;
    $("status").textContent = "";
  }
};

function renderTest(topic) {
  submitted = false;
  $("setup").classList.add("hidden");
  $("test").classList.remove("hidden");
  $("result").classList.add("hidden");
  $("submit").classList.remove("hidden");
  $("testTitle").textContent = `Java: ${topic}`;
  const box = $("questions");
  box.innerHTML = "";

  quiz.questions.forEach((q, i) => {
    const card = document.createElement("div");
    card.className = "q panel";

    const h = document.createElement("h3");
    const n = document.createElement("span");
    n.className = "num"; n.textContent = `${i + 1}.`;
    h.append(n, document.createTextNode(q.question));
    card.appendChild(h);

    if (q.code) {
      const pre = document.createElement("pre");
      pre.textContent = q.code;
      card.appendChild(pre);
    }

    q.options.forEach((opt, j) => {
      const l = document.createElement("label");
      l.className = "opt";
      const r = document.createElement("input");
      r.type = "radio"; r.name = `q${i}`; r.value = j;
      r.onchange = updateProgress;
      l.append(r, document.createTextNode(opt));
      card.appendChild(l);
    });
    box.appendChild(card);
  });
  updateProgress();
  window.scrollTo({ top: 0 });
}

function updateProgress() {
  const answered = quiz.questions.filter((_, i) => document.querySelector(`input[name=q${i}]:checked`)).length;
  $("progress").textContent = `${answered} / ${quiz.questions.length} answered`;
}

$("submit").onclick = () => {
  if (submitted) return;
  const unanswered = quiz.questions.filter((_, i) => !document.querySelector(`input[name=q${i}]:checked`)).length;
  if (unanswered && !confirm(`${unanswered} question(s) unanswered. Submit anyway?`)) return;
  submitted = true;

  let score = 0;
  quiz.questions.forEach((q, i) => {
    const card = $("questions").children[i];
    const opts = card.querySelectorAll(".opt");
    const chosen = document.querySelector(`input[name=q${i}]:checked`);
    opts.forEach((o) => (o.querySelector("input").disabled = true));
    opts[q.answer].classList.add("correct");
    if (chosen && Number(chosen.value) === q.answer) score++;
    else if (chosen) opts[Number(chosen.value)].classList.add("wrong");

    if (q.explanation) {
      const ex = document.createElement("div");
      ex.className = "explain";
      ex.textContent = q.explanation;
      card.appendChild(ex);
    }
  });

  const pct = Math.round((score / quiz.questions.length) * 100);
  $("result").innerHTML = `<div class="big">${score} / ${quiz.questions.length}</div><div class="sub">${pct}% correct</div>`;
  $("result").classList.remove("hidden");
  $("submit").classList.add("hidden");
  $("result").scrollIntoView({ behavior: "smooth" });
};

$("newTest").onclick = () => {
  $("test").classList.add("hidden");
  $("setup").classList.remove("hidden");
};
</script>
</body>
</html>
